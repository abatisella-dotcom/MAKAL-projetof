<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação JWT</title>
    <!-- Google Fonts for premium modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        Exercício Autenticação JWT
    </header>

    <div class="app">
        <div class="container">
            <!-- Login Section (shown initially) -->
            <div id="login-section">
                <h2>Login</h2>
                <form id="login-form">
                    <input type="text" id="username" placeholder="Usuário" required>
                    <input type="password" id="password" placeholder="Senha" required>
                    <button type="submit">Entrar</button>
                </form>
                <p id="login-message"></p>
            </div>

            <!-- Secret Section (shown on success) -->
            <div id="secret-section" class="hidden">
                <h1>Parabéns!</h1>
                <h2>Você acertou o login</h2>
                <div id="imagem"></div>
                <p id="secret-message"></p>
                <div class="imagem2">
                    <img src="./image.png" alt="Sucesso">
                </div>
                <button id="logout-button">Sair</button>
            </div>
        </div>
    </div>

    <footer>
        @ desenvolvido por MAKAL
    </footer>

    <script src="script.js"></script>
</body>

</html>
